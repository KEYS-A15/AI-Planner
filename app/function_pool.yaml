move_forward:
  description: |
    Move the agent in a specific direction at a specific speed. Any directional movement should use this to specift right or left turn and move ahead
    The direction is represented by an integer:
    -> 0 = walking forward
    -> 1 = turning right and walking straight
    -> 2 = turning left and walking straight
    -> 3 = walking backwards
    speed is an integer from 1 (slow) to 10 (fast)
  parameters:
    direction: int
    speed: int

turn_back:
  description: >
    Rotate the agent 180 degrees to face the opposite direction.
    This is typically used when the agent needs to return to its previous location.
  parameters: {}

pick_up:
  description: >
    Pick up an object in front of the agent.
    The object must be identified by a unique item ID or item name string.
    The agent must be close enough to the object for this to succeed.
  parameters:
    item_id: str

pay:
  description: >
    Pay a specified amount of money for an item or service.
    The amount is given as an integer, representing the value in credits or units.
  parameters:
    amount: int
